# 昆明积水地图 - 静态站点（宿主机 :8088 → 容器 :80）
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    env_file:
      - path: .env
        required: false
    environment:
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped

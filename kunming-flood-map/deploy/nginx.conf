server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1k;

    # 安全响应头（style unsafe-inline：Leaflet 运行时内联样式必需）
    # 注意：location 内一旦写 add_header 会清空继承，故缓存策略统一用 expires 指令表达
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://webrd01.is.autonavi.com https://webrd02.is.autonavi.com https://webrd03.is.autonavi.com https://webrd04.is.autonavi.com data:; connect-src 'self' https://nominatim.openstreetmap.org; font-src 'self' data:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 高德底图瓦片直连高德 CDN，无需 nginx 代理

    # html / 应用代码：更新频繁，协商缓存（每次校验，304 省流量）
    location = /index.html {
        expires -1; # Cache-Control: no-cache
    }
    location ~* \.(css|js|geojson)$ {
        expires -1;
        etag on;
    }

    # 第三方库与图片：内容长期不变，长缓存（^~ 让 /vendor/ 优先于 .js 正则）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
    }
    location ^~ /vendor/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 昆明积水地图 - 静态站点 nginx 配置
# 参考 ai_learning/deploy/nginx.conf 的安全加固（对外暴露纯 IP 无域名）：
#   - 安全响应头：nosniff / X-Frame-Options / Referrer-Policy / CSP
#   - server_tokens off 隐藏版本；点文件拒绝
#   - CSP 放行高德瓦片主机（webrd01~04.is.autonavi.com），其余全部 'self'
#   - Leaflet 已本地化到 /vendor/，不依赖 unpkg CDN
#   - 纯 IP 部署不上 HSTS（HSTS 仅在 HTTPS 下生效）

server {
    listen 80;
    server_name _;

    server_tokens off;

    # 中文文件名/内容编码兜底
    charset utf-8;

    # 安全响应头（server 级，对所有 location 生效）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.is.autonavi.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # 点文件（.env/.git 等）一律拒绝
    location ~ /\. { deny all; }

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存；html 不缓存（地图数据更新后能立即生效）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 文本类资源开 gzip（html/js/css 都是文本，瓦片是图片不开）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
